name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.task.name }}
    runs-on: ubuntu-latest

    strategy:
      # Report every failing gate in one run rather than stopping at the first.
      fail-fast: false
      matrix:
        task:
          - name: Lint
            run: npm run lint
          - name: Typecheck
            run: npm run typecheck
          - name: Test
            run: npm test -- --ci --coverage
          - name: Build
            run: npm run build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `--ignore-scripts` skips the `prepare` build, which the Build task
      # runs explicitly and the others do not need.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: ${{ matrix.task.name }}
        run: ${{ matrix.task.run }}

  package:
    name: Package contents
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      # Surfaces anything that would be published by mistake.
      - name: Inspect publishable files
        run: npm pack --dry-run
